name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Installa ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test del core
        run: dotnet test tests/VideoEditor.Core.Tests --configuration Release

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pubblica editor e vedit
        run: dotnet publish VideoEditor.App -c Release -o publish/VideoEditor
      - uses: actions/upload-artifact@v4
        with:
          name: video-editor-windows
          path: publish/VideoEditor
